<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- =========================
         FONT
         ========================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <title>Something is Hidden...</title>


    <style>

        /* =========================
           GENERAL PAGE
           ========================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #080001;

            font-family: "Gaegu", cursive;

            color: #fff0f2;

            touch-action: none;

            user-select: none;

            cursor: none;
        }


        /* =========================
           MAIN HUNTING AREA
           ========================= */

        #hunt-area {

            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at center,
                    #180006 0%,
                    #0b0002 55%,
                    #030001 100%
                );
        }


        /* =========================
           INSTRUCTIONS
           ========================= */

        #instructions {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: 90%;

            text-align: center;

            pointer-events: none;

            z-index: 2;
        }


        #instructions h1 {

            margin: 0 0 16px;

            font-family: "Gaegu", cursive;

            font-size: 52px;

            font-weight: 700;

            letter-spacing: 1px;

            color: #fff2f3;

            text-shadow:
                0 0 15px
                rgba(255, 210, 220, 0.15);
        }


        #instructions p {

            margin: 8px 0;

            font-family: "Gaegu", cursive;

            font-size: 24px;

            font-weight: 400;

            color: #d9a4aa;
        }


        #instructions .hint {

            margin-top: 20px;

            font-size: 19px;

            opacity: 0.55;

            font-style: normal;
        }


        /* =========================
           FLASHLIGHT
           ========================= */

        #flashlight {

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 5;

            background:
                radial-gradient(
                    circle 130px
                    at var(--mouse-x)
                    var(--mouse-y),

                    rgba(255, 245, 245, 0.18) 0%,

                    rgba(255, 220, 225, 0.08) 35%,

                    rgba(0, 0, 0, 0.88) 100%
                );
        }


        /* Small glow in the center
           of the flashlight */

        #flashlight::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle 45px
                    at var(--mouse-x)
                    var(--mouse-y),

                    rgba(255, 235, 238, 0.10),

                    transparent 100%
                );
        }


        /* =========================
           HIDDEN HEART
           ========================= */

        #hidden-object {

            position: absolute;

            /*
                JavaScript will replace
                these with a random position
                when the page loads.
            */

            left: 50%;
            top: 50%;

            width: 42px;
            height: 42px;

            background: #fff8e7;

            transform:
                rotate(-45deg)
                scale(0.8);

            border-radius:
                5px 0 5px 0;

            opacity: 0;

            cursor: none;

            z-index: 4;

            transition:
                opacity 0.15s ease,
                transform 0.2s ease;
        }


        /* Top half of heart */

        #hidden-object::before {

            content: "";

            position: absolute;

            width: 42px;
            height: 42px;

            top: -21px;
            left: 0;

            background: #fff8e7;

            border-radius: 50%;
        }


        /* Side half of heart */

        #hidden-object::after {

            content: "";

            position: absolute;

            width: 42px;
            height: 42px;

            top: 0;
            left: 21px;

            background: #fff8e7;

            border-radius: 50%;
        }


        /* Heart is revealed
           when flashlight gets close */

        #hidden-object.found-nearby {

            opacity: 1;

            transform:
                rotate(-45deg)
                scale(1);

            filter:
                drop-shadow(
                    0 0 10px #d41436
                )

                drop-shadow(
                    0 0 25px
                    rgba(212, 20, 54, 0.7)
                );
        }


        /* =========================
           FLASHLIGHT CURSOR
           ========================= */

        #flashlight-cursor {

            position: fixed;

            width: 18px;
            height: 18px;

            border:
                1px solid
                rgba(255, 235, 238, 0.7);

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            z-index: 50;

            box-shadow:
                0 0 8px
                rgba(255, 220, 225, 0.5);
        }


        /* =========================
           BIRTHDAY POPUP
           ========================= */

        #popup {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                rgba(8, 0, 2, 0.88);

            backdrop-filter: blur(5px);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.35s ease;

            z-index: 100;
        }


        #popup.show {

            opacity: 1;

            visibility: visible;
        }


        /* =========================
           POPUP BOX
           ========================= */

        #popup-box {

            width: min(520px, 86vw);

            padding: 45px 35px;

            background:
                linear-gradient(
                    145deg,
                    #5b0815,
                    #2b0007
                );

            border:
                1px solid #9f2639;

            border-radius: 22px;

            text-align: center;

            box-shadow:

                0 20px 70px
                rgba(0, 0, 0, 0.8),

                0 0 50px
                rgba(120, 0, 20, 0.3);

            transform: scale(0.8);

            transition:
                transform 0.35s ease;
        }


        #popup.show #popup-box {

            transform: scale(1);
        }


        /* Decorative heart */

        #popup-box::before {

            content: "♥";

            display: block;

            margin-bottom: 8px;

            font-family:
                "Gaegu",
                cursive;

            font-size: 50px;

            font-weight: 700;

            color: #fff8e7;
        }


        /* Popup heading */

        #popup-box h2 {

            margin-top: 0;

            font-family:
                "Gaegu",
                cursive;

            font-size: 46px;

            font-weight: 700;

            color: #fff4f5;

            text-shadow:
                0 0 15px
                rgba(255, 190, 200, 0.12);
        }


        /* Popup text */

        #popup-box p {

            font-family:
                "Gaegu",
                cursive;

            font-size: 24px;

            line-height: 1.6;

            font-weight: 400;

            color: #e8bfc4;
        }


        /* =========================
           CLOSE BUTTON
           ========================= */

        #close-popup {

            margin-top: 20px;

            padding: 10px 28px;

            border:
                1px solid #a52a3b;

            border-radius: 999px;

            background: #7c0017;

            color: #fff5f5;

            font-family:
                "Gaegu",
                cursive;

            font-size: 22px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        #close-popup:hover {

            background: #a5001d;

            transform: scale(1.05);
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            #instructions h1 {

                font-size: 42px;
            }


            #instructions p {

                font-size: 21px;
            }


            #instructions .hint {

                font-size: 17px;
            }


            #flashlight {

                background:
                    radial-gradient(
                        circle 110px
                        at var(--mouse-x)
                        var(--mouse-y),

                        rgba(255, 245, 245, 0.18)
                        0%,

                        rgba(255, 220, 225, 0.07)
                        35%,

                        rgba(0, 0, 0, 0.90)
                        100%
                    );
            }


            #hidden-object {

                width: 38px;
                height: 38px;
            }


            #hidden-object::before,
            #hidden-object::after {

                width: 38px;
                height: 38px;
            }


            #hidden-object::before {

                top: -19px;
            }


            #hidden-object::after {

                left: 19px;
            }


            #popup-box {

                padding: 38px 25px;
            }


            #popup-box h2 {

                font-size: 40px;
            }


            #popup-box p {

                font-size: 21px;

                line-height: 1.55;
            }


            #close-popup {

                font-size: 20px;
            }


            /* Phones don't have
               a mouse cursor */

            #flashlight-cursor {

                display: none;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HUNTING AREA
         ========================= -->

    <main id="hunt-area">


        <!-- Instructions -->

        <div id="instructions">

            <h1>
                Something is hidden here...
            </h1>


            <p>
                Shine your light around and find it.
            </p>


            <p class="hint">
                Move slowly. You might miss it.
            </p>

        </div>


        <!-- Hidden heart -->

        <div id="hidden-object"></div>


        <!-- Flashlight overlay -->

        <div id="flashlight"></div>


        <!-- Small cursor ring -->

        <div id="flashlight-cursor"></div>

    </main>



    <!-- =========================
         BIRTHDAY POPUP
         ========================= -->

    <div id="popup">


        <div id="popup-box">


            <h2>
                YAYY YOU FOUND IT
            </h2>


            <p>
                HAPPY BIRTHDAY!!!
            </p>


            <p>
                I HOPE YOU LIKED THIS LIL THING. <br>
                I actually took help from a friend <br>
                to make this, but some of it <br>
                is my own talent I swear.
            </p>


            <button id="close-popup">
                Close ♡
            </button>


        </div>

    </div>



    <script>

        /* =========================
           GET ELEMENTS
           ========================= */

        const hiddenObject =
            document.getElementById(
                "hidden-object"
            );


        const flashlight =
            document.getElementById(
                "flashlight"
            );


        const flashlightCursor =
            document.getElementById(
                "flashlight-cursor"
            );


        const popup =
            document.getElementById(
                "popup"
            );


        const closePopup =
            document.getElementById(
                "close-popup"
            );


        /* =========================
           RANDOM HEART POSITION
           ========================= */

        function randomizeHeartPosition() {

            /*
                These percentages keep
                the heart away from the
                very edges of the screen.
            */

            const minX = 10;
            const maxX = 90;

            const minY = 15;
            const maxY = 85;


            const randomX =
                Math.random() *
                (maxX - minX) +
                minX;


            const randomY =
                Math.random() *
                (maxY - minY) +
                minY;


            hiddenObject.style.left =
                randomX + "%";


            hiddenObject.style.top =
                randomY + "%";
        }


        /* Run once on page load */

        randomizeHeartPosition();


        /* =========================
           GET HEART CENTER
           ========================= */

        function getHeartCenter() {

            const rect =
                hiddenObject.getBoundingClientRect();


            return {

                x:
                    rect.left +
                    rect.width / 2,

                y:
                    rect.top +
                    rect.height / 2
            };
        }


        /* =========================
           MOVE FLASHLIGHT
           ========================= */

        function moveFlashlight(x, y) {

            /* Move light */

            flashlight.style.setProperty(
                "--mouse-x",
                x + "px"
            );


            flashlight.style.setProperty(
                "--mouse-y",
                y + "px"
            );


            /* Move cursor ring */

            flashlightCursor.style.left =
                x + "px";


            flashlightCursor.style.top =
                y + "px";


            /* Check for heart */

            checkHeartDistance(x, y);
        }


        /* =========================
           CHECK HEART DISTANCE
           ========================= */

        function checkHeartDistance(x, y) {

            const heart =
                getHeartCenter();


            const dx =
                x - heart.x;


            const dy =
                y - heart.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
                Increase this number
                to make the heart easier
                to discover.

                Decrease it to make
                the hunt harder.
            */

            const revealDistance = 75;


            if (
                distance <
                revealDistance
            ) {

                hiddenObject.classList.add(
                    "found-nearby"
                );
            }
        }


        /* =========================
           DESKTOP MOUSE
           ========================= */

        document.addEventListener(
            "mousemove",
            function(event) {

                moveFlashlight(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* =========================
           MOBILE TOUCH
           ========================= */

        document.addEventListener(
            "pointermove",
            function(event) {

                if (
                    event.pointerType ===
                    "touch"
                ) {

                    moveFlashlight(
                        event.clientX,
                        event.clientY
                    );

                }

            }
        );


        /* =========================
           CLICK / TAP HEART
           ========================= */

        hiddenObject.addEventListener(
            "click",
            function() {

                popup.classList.add(
                    "show"
                );

            }
        );


        /* =========================
           CLOSE POPUP
           ========================= */

        closePopup.addEventListener(
            "click",
            function() {

                popup.classList.remove(
                    "show"
                );

            }
        );


        /* =========================
           CLICK OUTSIDE POPUP
           ========================= */

        popup.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === popup
                ) {

                    popup.classList.remove(
                        "show"
                    );

                }

            }
        );

    </script>

</body>
</html>
